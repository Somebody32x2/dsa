# Static files behind Coolify's proxy, which strips the /education/dsa prefix before requests get here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # No build step, so file names never change: always revalidate (cheap 304s).
    add_header Cache-Control "no-cache" always;

    location / {
        # Serve a folder's index.html directly. nginx's own "/trees -> /trees/" redirect would point
        # at a path without the stripped prefix; each index.html adds the trailing slash itself.
        try_files $uri $uri/index.html =404;
    }
}
